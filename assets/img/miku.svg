      <circle cx="252" cy="339" r="11.5" fill="url(#eye)"/>
      <circle cx="252" cy="341" r="5.5" fill="#0c1a3a"/>
      <ellipse cx="247" cy="332" rx="5" ry="7.5" fill="#fff" opacity=".95" transform="rotate(-18 247 332)"/>
      <circle cx="258" cy="345" r="2.6" fill="#fff" opacity=".85"/>
      <path d="M267 326 Q278 331 281 344" fill="none" stroke="#22315e" stroke-width="3.4" stroke-linecap="round"/>
    </g>
