    <path d="M118 120 Q118 127 111 127 Q118 127 118 134 Q118 127 125 127 Q118 127 118 120 Z" opacity=".8"/>
    <path d="M330 152 Q330 157 325 157 Q330 157 330 162 Q330 157 335 157 Q330 157 330 152 Z" opacity=".65"/>
