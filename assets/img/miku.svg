<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="t d">
  <title id="t">中野三玖风格头像</title>
  <desc id="d">粉丝绘制的蓝色长发、佩戴耳机的少女风格化示意图</desc>
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb9ff"/>
      <stop offset=".5" stop-color="#5f8fe8"/>
      <stop offset="1" stop-color="#3a5fb4"/>
    </linearGradient>
    <linearGradient id="hairDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d96e8"/>
      <stop offset="1" stop-color="#2f4f9e"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4076"/>
      <stop offset="1" stop-color="#182350"/>
    </linearGradient>
    <radialGradient id="eye" cx=".38" cy=".35" r="1">
      <stop offset="0" stop-color="#c8f6ff"/>
      <stop offset=".45" stop-color="#4fb2ff"/>
      <stop offset="1" stop-color="#2a6ae0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9cc4ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#9cc4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="210" cy="300" r="205" fill="url(#glow)"/>

  <!-- 后发 -->
  <path d="M210 128 C124 128 82 186 84 292 C86 376 104 462 120 502 L300 502 C316 462 334 376 336 292 C338 186 296 128 210 128 Z" fill="url(#hairDeep)"/>

  <!-- 制服肩部 -->
  <path d="M90 520 C90 486 106 462 130 452 C150 445 172 446 188 450 L210 457 L232 450 C248 446 270 445 290 452 C314 462 330 486 330 520 Z" fill="url(#blazer)"/>
  <!-- 衬衫 -->
  <path d="M186 452 L234 452 L210 494 Z" fill="#f3f7ff"/>
  <circle cx="210" cy="476" r="2.1" fill="#e0c37c"/>
  <circle cx="210" cy="489" r="2.1" fill="#e0c37c"/>

  <!-- 脖颈 -->
  <rect x="193" y="400" width="34" height="62" rx="9" fill="#ffe9da"/>
  <path d="M193 412 C193 452 200 458 210 458 C220 458 227 452 227 412 L227 400 L193 400 Z" fill="#f6d3bd" opacity=".55"/>

  <!-- 脸 -->
  <ellipse cx="210" cy="300" rx="82" ry="92" fill="#ffe9da"/>
  <path d="M130 310 C128 260 150 220 190 210 C160 226 146 262 148 312 C149 344 158 366 172 380 C152 366 134 344 130 310 Z" fill="#f6d3bd" opacity=".5"/>
  <path d="M290 310 C292 260 270 220 230 210 C260 226 274 262 272 312 C271 344 262 366 248 380 C268 366 286 344 290 310 Z" fill="#f6d3bd" opacity=".5"/>

  <!-- 眼睛 -->
  <g id="eyes">
    <g>
      <ellipse cx="168" cy="338" rx="17" ry="20" fill="#22315e"/>
      <circle cx="168" cy="339" r="11.5" fill="url(#eye)"/>
      <circle cx="168" cy="341" r="5.5" fill="#0c1a3a"/>
      <ellipse cx="163" cy="332" rx="5" ry="7.5" fill="#fff" opacity=".95" transform="rotate(-18 163 332)"/>
      <circle cx="174" cy="345" r="2.6" fill="#fff" opacity=".85"/>
      <path d="M153 326 Q142 331 139 344" fill="none" stroke="#22315e" stroke-width="3.4" stroke-linecap="round"/>
