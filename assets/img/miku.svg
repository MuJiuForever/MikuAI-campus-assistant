      <rect x="-20" y="-26" width="40" height="24" rx="15" fill="#42528c"/>
      <rect x="-11" y="-8" width="22" height="30" rx="11" fill="#19244d"/>
      <rect x="-7" y="-5" width="14" height="24" rx="7" fill="#0f1737"/>
